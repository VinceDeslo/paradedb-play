[package]
name = "paradedb-play"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
dotenvy = "0.15.7"
sqlx = { version = "0.8.5", features = [ "runtime-tokio", "postgres", "macros" ] }
tokio = { version = "1.44.2", features = [ "full" ] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = [ "env-filter" ] }
